<meta name="description" content="Wthb Studio — art direction, branding and digital products, focused on branding.">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Wthb Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: cinematic index — fixed bar (logo · name · switches + menu), hero line, full-screen work panels stacking on scroll, then services and contact. Cream and black, two modes. */
:root{
  --bg:#edece5; --fg:#101014; --muted:rgba(16,16,20,.5); --line:rgba(16,16,20,.14); --panel:#e1e0d8;
  --font:"Helvetica Neue","Neue Haas Grotesk Display Pro",Helvetica,"Inter Tight",Arial,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Helvetica Neue",Arial,sans-serif;
  --gx:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
body.dark{--bg:#0a0a0a; --fg:#edece5; --muted:rgba(237,236,229,.55); --line:rgba(237,236,229,.14); --panel:#151515; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body.ar{font-family:var(--font-ar)}
body.ar *{letter-spacing:0!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
.ltr{direction:ltr;unicode-bidi:isolate}

/* Bar */
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding-left:var(--gx);padding-right:var(--gr);padding-block:14px 30px;font-size:14px;font-weight:500;color:var(--fg);background:linear-gradient(var(--bg) 50%,transparent);pointer-events:none;transition:color .4s}
.bar a,.bar button{pointer-events:auto}
.brand{display:flex;align-items:center;text-decoration:none;justify-self:start}
.name{justify-self:center;text-decoration:none}

.tools{justify-self:end;display:flex;align-items:center;gap:2px}
.tools button{height:34px;min-width:34px;display:grid;place-items:center;border-radius:999px}
.tools .lang{padding:0 8px;font-family:var(--font-ar)}
body.ar .tools .lang{font-family:var(--font)}
.tools .mode svg{width:19px;height:19px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.dark .tools .mode svg{transform:rotate(180deg)}
.tools #menu-btn{padding-inline-start:8px}

/* Menu overlay */
.menu{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;padding-left:var(--gx);padding-right:var(--gr);padding-block:80px 40px;clip-path:inset(0 0 100% 0);transition:clip-path .6s cubic-bezier(.7,0,.2,1),background .4s;visibility:hidden}
.menu.open{clip-path:inset(0 0 0 0);visibility:visible}
.menu ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.menu li{border-bottom:1px solid var(--line)}
.menu li button{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding-block:14px;font-size:clamp(40px,10vw,112px);font-weight:700;letter-spacing:-.05em;line-height:1;text-align:start}
.menu li small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted)}
.menu-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:var(--gr);height:34px;font-size:14px;font-weight:500}

/* Hero */
.hero{position:relative;min-height:62svh;display:flex;align-items:flex-end;padding-left:var(--gx);padding-right:var(--gr);padding-block:120px 28px;background:var(--bg);z-index:1;transition:background .4s}
.hero-grid{display:grid;grid-template-columns:1fr;gap:18px;width:100%;align-items:end}
@media (min-width:820px){.hero-grid{grid-template-columns:1fr auto;gap:32px}}
.hero p{margin:0;font-size:clamp(20px,2.6vw,30px);font-weight:500;letter-spacing:-.02em;line-height:1.2;max-width:28ch}
body.ar .hero p{line-height:1.5}
.hero .hint{font-size:13px;color:var(--muted)}

/* Work panels — sticky stack, images only */
.panel{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--panel);display:block;width:100%}
.panel img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;will-change:transform}
.panel::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.28));z-index:1;pointer-events:none}
.panel .dim{position:absolute;inset:0;background:#000;opacity:var(--dim,0);z-index:4;pointer-events:none}
.row{position:absolute;left:0;right:0;top:50%;z-index:3;display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:baseline;padding-left:var(--gx);padding-right:var(--gr);color:#fff;text-shadow:0 1px 18px rgba(0,0,0,.25)}
.row .t{font-size:clamp(17px,2.4vw,24px);font-weight:700;letter-spacing:-.025em}
.row .c,.row .n{font-size:clamp(15px,2vw,20px);font-weight:500;letter-spacing:-.015em;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
@media (max-width:560px){.row{grid-template-columns:1fr auto;top:auto;bottom:28px}.row .c{grid-column:1;grid-row:2;margin-top:-10px}.row .n{grid-row:1;grid-column:2}}
.panel.split{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--bg)}
.cell{position:relative;overflow:hidden;height:100%;background:var(--panel)}
.cell .row{top:auto;bottom:28px;grid-template-columns:1fr auto;padding-left:24px;padding-right:24px}
.cell .row .c{grid-column:1;grid-row:2;margin-top:-8px}.cell .row .n{grid-column:2;grid-row:1}
.cell::after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.45));z-index:2;pointer-events:none}

/* Sections after the stack */
.after{position:relative;z-index:5;background:var(--bg);transition:background .4s}
.sec{display:grid;grid-template-columns:1fr;gap:24px;padding-left:var(--gx);padding-right:var(--gr);padding-block:120px 100px}
@media (min-width:820px){.sec{grid-template-columns:1fr 2fr 1fr;gap:32px}}
.label{font-size:14px;font-weight:500;padding-top:12px;border-top:1px solid var(--line);width:max-content;min-width:48px;align-self:start}
.statement{margin:0 0 18px;font-size:clamp(30px,4.2vw,52px);font-weight:700;letter-spacing:-.045em;line-height:1.05;text-wrap:balance}
body.ar .statement{line-height:1.35}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);font-size:clamp(24px,3.4vw,40px);font-weight:700;letter-spacing:-.04em;line-height:1.15}
.svc li:first-child{border-top:1px solid var(--line)}
.svc small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb{width:100%;max-width:220px;aspect-ratio:3/4;object-fit:cover;justify-self:end;align-self:start;background:var(--panel)}
@media (max-width:819px){.thumb{display:none}}
.big{margin:0 0 40px;font-size:clamp(64px,15vw,220px);font-weight:700;letter-spacing:-.06em;line-height:.9}
body.ar .big{line-height:1.2}
.contact{margin:0;display:flex;flex-direction:column}
.contact div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.contact div:first-child{border-top:1px solid var(--line)}
.contact dt{font-size:14px;color:var(--muted)}
.contact dd{margin:0;font-family:var(--font);font-size:clamp(18px,2.4vw,26px);font-weight:500;letter-spacing:-.02em;text-align:end;min-width:0;overflow-wrap:anywhere}
.contact a{text-decoration:none}
.contact a:hover{text-decoration:underline;text-underline-offset:4px}
.copy{margin-inline-start:12px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);vertical-align:middle}
body.ar .copy{font-family:var(--font-ar)}
.copy:hover{color:var(--fg)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-left:var(--gx);padding-right:var(--gr);padding-block:24px 32px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* Cursor */
.cursor{position:fixed;left:0;top:0;z-index:100;pointer-events:none;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;mix-blend-mode:difference;transition:width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),margin .35s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0}
.cursor.link{width:40px;height:40px;margin:-20px 0 0 -20px}
@media (hover:hover) and (pointer:fine){.has-cursor,.has-cursor *{cursor:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.panel img{transform:none!important}}
</style>

  <div id="work"></div>
  <div id="stack"></div>

  <div class="after">
    <section class="sec" id="services">
      <span class="label" data-t="services"></span>
      <div>
        <p class="statement" data-t="statement"></p>
        <ul class="svc" id="svc"></ul>
      </div>
      <img class="thumb" src="sincere.webp" alt="">
    </section>

    <section class="sec" id="talk">
      <span class="label" data-t="contact"></span>
      <div>
        <p class="big" data-t="talk"></p>
        <dl class="contact">
          <div><dt data-t="wa"></dt><dd><a href="https://wa.me/966540886435?text=Hi%2C%20I%27d%20like%20to%20talk%20about%20a%20project" target="_blank" rel="noopener" dir="ltr">+966 54 088 6435</a></dd></div>
          <div><dt data-t="email"></dt><dd><span id="email" dir="ltr" style="user-select:all">Wthbstudio@gmail.com</span><button class="copy" id="copy-email" type="button" data-t="copy"></button></dd></div>
          <div><dt data-t="ig"></dt><dd><a href="https://www.instagram.com/wthbstudio/" target="_blank" rel="noopener" dir="ltr">@wthbstudio</a></dd></div>
        </dl>
      </div>
      <span></span>
    </section>
    <footer class="foot"><span data-t="foot"></span><span class="ltr">@wthbstudio</span></footer>
  </div>
</main>
<div class="cursor" id="cursor" aria-hidden="true"></div>

<script>
const T={
 en:{name:"Wthb Studio",menu:"Menu",close:"Close",work:"Work",services:"Services",talk:"Let's talk",talkSub:"WhatsApp · Email",
  hero:"Wthb Studio. Art direction, branding and digital products, focused on branding.",hint:"Scroll to explore",
  statement:"Making brands memorable through clear ideas, careful craft and design that holds up everywhere it lives.",
  contact:"Contact",wa:"WhatsApp",email:"Email",ig:"Instagram",copy:"Copy",copied:"Copied",foot:"©2026 wthbstudio, All rights reserved",
  svc:["Art Direction","Webdesign","UX/UI Design","Branding","Motion Design","Web Development"]},
 ar:{name:"وثب ستوديو",menu:"القائمة",close:"إغلاق",work:"الأعمال",services:"الخدمات",talk:"لنتحدث",talkSub:"واتساب · البريد",
  hero:"وثب ستوديو. توجيه فني وهويات بصرية ومنتجات رقمية، بتركيز على الهوية البصرية.",hint:"مرّر للاستكشاف",
  statement:"نصنع علامات تجارية لا تُنسى بأفكار واضحة وحِرفة متقنة وتصميم يصمد في كل مكان يظهر فيه.",
  contact:"تواصل",wa:"واتساب",email:"البريد",ig:"إنستقرام",copy:"نسخ",copied:"تم النسخ",foot:"©2026 وثب ستوديو، جميع الحقوق محفوظة",
  svc:["التوجيه الفني","تصميم المواقع","تصميم واجهة وتجربة المستخدم","الهوية البصرية","الموشن جرافيك","تطوير المواقع"]}
};
const P=[
 {title:{en:"OTHR",ar:"OTHR"},service:3,img:"othr.webp"},
 {title:{en:"Sincere Elegance",ar:"Sincere Elegance"},service:3,tall:true,img:"sincere.webp"},
 {title:{en:"Filfil",ar:"Filfil"},service:0,tall:true,img:"filfil.webp"},
 {title:{en:"Alameriah Contracting",ar:"العامرية للمقاولات"},service:3,tall:true,img:"alameriah.jpg"},
 {title:{en:"Pool",ar:"Pool"},service:2,img:"pool.webp"}
];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("wthb-lang")==="ar"?"ar":"en";
const t=k=>T[lang][k];

/* Mode: cream (default) or dark */
function setMode(d){document.body.classList.toggle("dark",d);store.set("wthb-mode",d?"dark":"light")}
setMode(store.get("wthb-mode")==="dark");
$("mode").onclick=()=>setMode(!document.body.classList.contains("dark"));

/* Work panels (images only, not clickable) */
let panels=[];
const wideMQ=matchMedia("(min-width:760px) and (min-aspect-ratio:1/1)");
function label(p,i){return `<span class="row"><span class="t">${p.title[lang]}</span><span class="c">${t("svc")[p.service]}</span><span class="n ltr">${pad(i+1)} / ${pad(P.length)}</span></span>`}
function buildStack(){
  const st=$("stack");st.innerHTML="";panels=[];
  const wide=wideMQ.matches;const tall=P.map((p,i)=>i).filter(i=>P[i].tall);let tallDone=false;
  P.forEach((p,i)=>{
    if(wide&&p.tall){
      if(tallDone)return;tallDone=true;
      const d=document.createElement("div");d.className="panel split";
      d.innerHTML=tall.map(j=>`<figure class="cell" style="margin:0"><img src="${P[j].img}" alt="${P[j].title[lang]}">${label(P[j],j)}</figure>`).join("")+`<span class="dim"></span>`;
      st.appendChild(d);panels.push(d);return;
    }
    const f=document.createElement("figure");f.className="panel";f.style.margin="0";
    f.innerHTML=`<img src="${p.img}" alt="${p.title[lang]}" ${i>1?'loading="lazy"':''}><span class="dim"></span>${label(p,i)}`;
    st.appendChild(f);panels.push(f);
  });
  requestAnimationFrame(onScroll);
}
wideMQ.addEventListener?wideMQ.addEventListener("change",buildStack):wideMQ.addListener(buildStack);
function buildSvc(){$("svc").innerHTML="";t("svc").forEach((name,i)=>{const n=P.filter(p=>p.service===i).length;const li=document.createElement("li");
  li.innerHTML=`<span>${name}</span>${n?`<small class="ltr">(${pad(n)})</small>`:""}`;$("svc").appendChild(li)})}

/* Language */
function setLang(l){
  lang=l;store.set("wthb-lang",l);
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.body.classList.toggle("ar",l==="ar");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("lang").textContent=l==="ar"?"EN":"ع";$("lang").setAttribute("aria-label",l==="ar"?"English":"العربية");
  buildStack();buildSvc();
}
$("lang").onclick=()=>setLang(lang==="ar"?"en":"ar");

/* Smooth scroll */
let lenis=null;
try{if(window.Lenis&&!matchMedia("(prefers-reduced-motion:reduce)").matches){lenis=new Lenis({lerp:.09,smoothWheel:true});
  const raf=x=>{lenis.raf(x);requestAnimationFrame(raf)};requestAnimationFrame(raf)}}catch(e){lenis=null}
const goTo=id=>{const el=id==="top"?0:$(id);if(lenis)lenis.scrollTo(el,{duration:1.4});else (el?el.scrollIntoView({behavior:"smooth"}):scrollTo({top:0,behavior:"smooth"}))};

/* Parallax + dimming as the next panel covers the current one */
function onScroll(){
  const vh=innerHeight;
  panels.forEach((el,i)=>{
    const top=el.getBoundingClientRect().top;
    const nx=panels[i+1]||document.querySelector(".after");const nt=nx.getBoundingClientRect().top;
    const cover=Math.min(1,Math.max(0,1-nt/vh));
    el.style.setProperty("--dim",(cover*.6).toFixed(3));
    const shift=top>0?(top/vh)*-4:cover*4;
    el.querySelectorAll("img").forEach(img=>img.style.transform=`translateY(${shift}%) scale(${1+cover*.04})`);
  });
}
addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});addEventListener("resize",onScroll);

/* Menu */
function setMenu(o){$("menu").classList.toggle("open",o);$("menu-btn").setAttribute("aria-expanded",o);if(lenis)o?lenis.stop():lenis.start()}
$("menu-btn").onclick=()=>setMenu(true);$("menu-close").onclick=()=>setMenu(false);
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();setMenu(false);setTimeout(()=>goTo(b.dataset.go),b.closest(".menu")?350:0)}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false)});

/* Copy email */
$("copy-email").onclick=()=>{const b=$("copy-email");
  const sel=()=>{const r=document.createRange();r.selectNodeContents($("email"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText($("email").textContent).then(()=>{b.textContent=t("copied");setTimeout(()=>b.textContent=t("copy"),1600)},sel)}catch(e){sel()}};

/* Cursor (mouse only) */
if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
  document.documentElement.classList.add("has-cursor");
  const c=$("cursor");let x=innerWidth/2,y=innerHeight/2,cx=x,cy=y;
  addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;c.style.opacity=1;c.classList.toggle("link",!!e.target.closest("a,button"))});
  document.addEventListener("mouseleave",()=>c.style.opacity=0);
  (function loop(){cx+=(x-cx)*.2;cy+=(y-cy)*.2;c.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(loop)})();
}

setLang(lang);
</script>

</body>
</html>

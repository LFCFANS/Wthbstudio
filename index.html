/* Layout: quiet index — numbered column, thumbnail, caption; a faded echo of the centred project behind; clock and switches on top, three-word nav at the bottom */
:root{
  --bg:#edece5; --fg:#101014; --muted:rgba(16,16,20,.48); --line:rgba(16,16,20,.12); --card:#e1e0d8; --ghost:.10;
  --font:"Helvetica Neue","Neue Haas Grotesk Text Pro",Helvetica,"Inter Tight",Arial,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Helvetica Neue",Arial,sans-serif;
  --gx:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
}
body.dark{--bg:#101014; --fg:#edece5; --muted:rgba(237,236,229,.5); --line:rgba(237,236,229,.14); --card:#1d1d21; --ghost:.14; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body.ar{font-family:var(--font-ar)}
body.ar *{letter-spacing:0!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}

/* Top bar: logo · clock · switches */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:var(--gx);padding-right:var(--gr);padding-block:16px 30px;background:linear-gradient(var(--bg) 45%,transparent);pointer-events:none}
.top>*{pointer-events:auto}

.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{justify-self:end;display:flex;align-items:center;gap:4px}
.sw button{height:34px;min-width:34px;display:grid;place-items:center;border-radius:999px;font-size:13px}
.lang{padding:0 8px;font-family:var(--font-ar)}
body.ar .lang{font-family:var(--font)}
.mode svg{width:20px;height:20px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.dark .mode svg{transform:rotate(180deg)}

/* Ghost echo */
.ghost{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ghost img{position:absolute;top:50%;inset-inline-end:-6%;width:min(78vw,760px);transform:translateY(-50%);opacity:0;transition:opacity .7s ease;filter:grayscale(.15)}
.ghost img.on{opacity:var(--ghost)}

/* Index */
main{position:relative;z-index:1;padding-left:var(--gx);padding-right:var(--gr);padding-block:34svh 0}
.intro{max-width:640px;margin:0 auto 52px;display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:13px;line-height:1.45;color:var(--muted)}
.intro p{margin:0;max-width:34ch}
.list{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:72px clamp(140px,40vw,250px) minmax(0,1fr);gap:10px;align-items:start;text-align:start;width:100%}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:pre;padding-top:1px;transition:color .3s;font-family:var(--font);direction:ltr;unicode-bidi:isolate;justify-self:start}
.th{display:block;overflow:hidden;background:var(--card)}
.th img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ti{font-size:13px;line-height:1.35;color:var(--muted);transition:color .3s;min-width:0;overflow-wrap:anywhere}
.ti small{display:block;font-size:12px;margin-top:2px;opacity:0;transform:translateY(-3px);transition:opacity .3s,transform .3s}
.row.on .num,.row.on .ti{color:var(--fg)}
.row.on .ti small{opacity:.55;transform:none}
@media (hover:hover){.row:hover .th img{transform:scale(1.03)}.row:hover .ti,.row:hover .num{color:var(--fg)}}
.foot{max-width:640px;margin:0 auto;padding-block:30svh 120px;font-size:12px;color:var(--muted);text-align:center}
.sheet .foot{padding-block:80px 0;text-align:start;max-width:none}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-left:var(--gx);padding-right:var(--gr);padding-top:44px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 62%);font-size:16px;letter-spacing:-.01em;transition:opacity .3s}
body.proj .nav{opacity:0;pointer-events:none}
.nav button{color:var(--muted);transition:color .2s}
.nav button[aria-current="true"]{color:var(--fg)}
.nav .l{justify-self:start;padding-inline-start:min(9vw,60px)}.nav .r{justify-self:end;padding-inline-end:min(9vw,60px)}

/* Overlays */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),visibility .4s,background .4s}
.sheet.open{opacity:1;visibility:visible;transform:none}
.sheet .in{max-width:900px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gr);padding-block:96px 150px}
.k{font-size:13px;color:var(--muted);margin:0 0 14px;font-variant-numeric:tabular-nums}
.h{margin:0 0 14px;font-size:clamp(34px,8vw,64px);font-weight:500;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
body.ar .h{line-height:1.25}
.p{margin:0 0 36px;font-size:16px;line-height:1.55;max-width:52ch}
.imgs{display:grid;gap:10px}
.imgs img{display:block;width:100%;height:auto;background:var(--card)}
.svc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);font-size:clamp(20px,5vw,30px);letter-spacing:-.025em}
.svc small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--font)}
.contact{margin:0;border-top:1px solid var(--line)}
.contact div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding-block:15px;border-bottom:1px solid var(--line)}
.contact dt{font-size:13px;color:var(--muted)}
.contact dd{margin:0;font-size:clamp(17px,4.4vw,22px);letter-spacing:-.015em;text-align:end;min-width:0;overflow-wrap:anywhere;font-family:var(--font)}
.contact a:hover{text-decoration:underline;text-underline-offset:4px}
.copy{margin-inline-start:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
body.ar .copy{font-family:var(--font-ar);font-size:12px}

/* Project controls */
.pbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);opacity:0;pointer-events:none;transition:opacity .3s,background .4s}
.pbar.show{opacity:1;pointer-events:auto}
.pbar button{height:46px;min-width:52px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-size:14px}
.pbar button:hover{background:var(--line)}
.pbar svg{width:20px;height:20px}

  <span class="clock" id="clock" aria-live="off"></span>
  <div class="sw">
    <button class="lang" id="lang" aria-label="العربية">ع</button>
    <button class="mode" id="mode" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
  </div>
</header>

<div class="ghost" aria-hidden="true" id="ghost"></div>

<main>
  <div class="intro"><span data-t="index"></span><p data-t="intro"></p></div>
  <div class="list" id="list"></div>
  <footer class="foot" data-t="foot"></footer>
</main>

<nav class="nav" aria-label="Main">
  <button class="l" data-go="projects" id="n-projects" data-t="projects"></button>
  <button data-go="studio" id="n-studio" data-t="studio"></button>
  <button class="r" data-go="talk" id="n-talk" data-t="talk"></button>
</nav>

<section class="sheet" id="v-studio" data-lenis-prevent>
  <div class="in">
    <p class="k" data-t="kStudio"></p>
    <h2 class="h" data-t="studioH"></h2>
    <p class="p" data-t="studioP"></p>
    <p class="k" data-t="kServices"></p>
    <ul class="svc" id="svc"></ul>
    <footer class="foot" data-t="foot"></footer>
  </div>
</section>

<section class="sheet" id="v-talk" data-lenis-prevent>
  <div class="in">
    <p class="k" data-t="kContact"></p>
    <h2 class="h" data-t="talk"></h2>
    <p class="p" data-t="talkP"></p>
    <dl class="contact">
      <div><dt data-t="wa"></dt><dd><a href="https://wa.me/966540886435?text=Hi%2C%20I%27d%20like%20to%20talk%20about%20a%20project" target="_blank" rel="noopener" dir="ltr">+966 54 088 6435</a></dd></div>
      <div><dt data-t="email"></dt><dd><span id="email" dir="ltr" style="user-select:all">Wthbstudio@gmail.com</span><button class="copy" id="copy" type="button" data-t="copy"></button></dd></div>
      <div><dt data-t="ig"></dt><dd><a href="https://www.instagram.com/wthbstudio/" target="_blank" rel="noopener" dir="ltr">@wthbstudio</a></dd></div>
    </dl>
    <footer class="foot" data-t="foot"></footer>
  </div>
</section>

<section class="sheet" id="v-project" data-lenis-prevent role="dialog" aria-modal="true" aria-labelledby="p-title">
  <div class="in">
    <p class="k" id="p-k"></p>
    <h2 class="h" id="p-title"></h2>
    <p class="p" id="p-intro"></p>
    <div class="imgs" id="p-imgs"></div>
  </div>
</section>
<div class="pbar" id="pbar">
  <button id="prev" aria-label="Previous project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="close" data-t="close"></button>
  <button id="next" aria-label="Next project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="cur" id="cur" aria-hidden="true"></div>

<script>
const T={
 en:{index:"( Index )",intro:"Wthb Studio. Art direction, branding and digital products, made in Riyadh.",projects:"Projects",studio:"Wthb Studio",talk:"Let's talk",
  kStudio:"( Studio )",studioH:"Making brands memorable through clear ideas and careful craft.",studioP:"A small design studio for art direction, branding and digital products. We build identities that are clear, calm and made to last.",
  kServices:"( Services )",kContact:"( Contact )",talkP:"Have a brand, a product or an idea that needs a clear voice? Send a message.",
  wa:"WhatsApp",email:"Email",ig:"Instagram",copy:"Copy",copied:"Copied",close:"Close",city:"Riyadh",foot:"©2026 wthbstudio, All rights reserved",
  services:["Art Direction","Webdesign","UX/UI Design","Branding","Motion Design","Web Development"]},
 ar:{index:"( الفهرس )",intro:"وثب ستوديو. توجيه فني وهويات بصرية ومنتجات رقمية، من الرياض.",projects:"المشاريع",studio:"وثب ستوديو",talk:"لنتحدث",
  kStudio:"( الاستوديو )",studioH:"نصنع علامات تجارية لا تُنسى بأفكار واضحة وحِرفة متقنة.",studioP:"استوديو تصميم صغير للتوجيه الفني والهويات البصرية والمنتجات الرقمية. نبني هويات واضحة وهادئة تدوم طويلاً.",
  kServices:"( الخدمات )",kContact:"( تواصل )",talkP:"عندك علامة تجارية أو منتج أو فكرة تحتاج صوتاً واضحاً؟ أرسل لنا رسالة.",
  wa:"واتساب",email:"البريد",ig:"إنستقرام",copy:"نسخ",copied:"تم النسخ",close:"إغلاق",city:"الرياض",foot:"©2026 وثب ستوديو، جميع الحقوق محفوظة",
  services:["التوجيه الفني","تصميم المواقع","تصميم واجهة وتجربة المستخدم","الهوية البصرية","الموشن جرافيك","تطوير المواقع"]}
};
const P=[
 {slug:"othr",service:3,img:"othr.webp",title:{en:"OTHR",ar:"OTHR"},
  intro:{en:"Identity for a speciality coffee house built around the idea of a house ritual. A wide, airy wordmark, a palette of rust, ochre and cream, and a calm serif voice that runs from cups to street posters.",
   ar:"هوية لمقهى قهوة مختصة مبنية على فكرة طقوس البيت. شعار نصي واسع ومتنفّس، وألوان من الصدأ والمغرة والكريمي، ونبرة هادئة بخط كلاسيكي تمتد من الأكواب إلى ملصقات الشارع."}},
 {slug:"sincere-elegance",service:3,img:"sincere.webp",title:{en:"Sincere Elegance",ar:"Sincere Elegance"},
  intro:{en:"A chocolate house that has worked the same way since 2010. A botanical emblem, a fine serif set vertically like a label on a bar, and photography that lets the broken chocolate do the talking.",
   ar:"بيت شوكولاتة يعمل بالطريقة نفسها منذ 2010. شعار نباتي، وخط كلاسيكي رفيع مكتوب عمودياً مثل ملصق على لوح الشوكولاتة، وتصوير يترك الشوكولاتة المكسورة تتكلم."}},
 {slug:"filfil",service:0,img:"filfil.webp",title:{en:"Filfil",ar:"Filfil"},
  intro:{en:"Campaign and identity for a fresh-food kitchen. Big, friendly headlines over warm produce photography, a boxed wordmark and a small pepper icon that signs off every piece.",
   ar:"حملة وهوية لمطبخ أكل طازج. عناوين كبيرة وودودة فوق صور دافئة للخضار، وشعار داخل إطار، وأيقونة فلفل صغيرة تختم كل تصميم."}},
 {slug:"alameriah",service:3,img:"alameriah.jpg",title:{en:"Alameriah Contracting",ar:"العامرية للمقاولات"},
  intro:{en:"A bilingual identity for a contracting company. A stacked-beam symbol drawn from building structure, paired with Arabic and Latin wordmarks set to the same weight and rhythm.",
   ar:"هوية ثنائية اللغة لشركة مقاولات. رمز من عوارض متراكبة مستوحى من هيكل البناء، مع شعارين عربي ولاتيني بالوزن والإيقاع نفسه."}},
 {slug:"pool",service:2,img:"pool.webp",title:{en:"Pool",ar:"Pool"},
  intro:{en:"Brand and app design for an investment platform. A clear wordmark, a quiet black-and-grey interface where the balance comes first, and a campaign line that keeps the promise simple.",
   ar:"هوية وتصميم تطبيق لمنصة استثمار. شعار واضح، وواجهة هادئة بالأسود والرمادي يظهر فيها الرصيد أولاً، وجملة حملة تبقي الوعد بسيطاً."}}
];
const $=id=>document.getElementById(id);
const thumb=p=>"t-"+p.img.replace(/\.\w+$/,".jpg");
const num=i=>"( "+String(P.length-i).padStart(2,"0")+". )";
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("wthb-lang")==="ar"?"ar":"en";
const t=k=>T[lang][k];

/* Theme */
function setMode(d){document.body.classList.toggle("dark",d);store.set("wthb-mode",d?"dark":"light")}
setMode(store.get("wthb-mode")==="dark");
$("mode").onclick=()=>setMode(!document.body.classList.contains("dark"));

/* Rows + ghosts */
let rows=[];
P.forEach(p=>{const g=new Image();g.src=thumb(p);g.alt="";$("ghost").appendChild(g)});
function buildRows(){
  $("list").innerHTML="";
  rows=P.map((p,i)=>{
    const b=document.createElement("button");b.className="row";b.setAttribute("aria-label",p.title[lang]);
    b.innerHTML=`<span class="num">${num(i)}</span><span class="th"><img src="${thumb(p)}" alt="" ${i>2?'loading="lazy"':''}></span><span class="ti">${p.title[lang]}<small>${t("services")[p.service]}</small></span>`;
    b.onclick=()=>{location.hash=p.slug};$("list").appendChild(b);return b;
  });
  $("svc").innerHTML="";
  t("services").forEach((n,i)=>{const c=P.filter(p=>p.service===i).length;const li=document.createElement("li");li.innerHTML=`<span>${n}</span>${c?`<small dir="ltr">( ${String(c).padStart(2,"0")} )</small>`:""}`;$("svc").appendChild(li)});
  active=-1;onScroll();
}

/* Language */
function setLang(l){
  lang=l;store.set("wthb-lang",l);
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.body.classList.toggle("ar",l==="ar");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("lang").textContent=l==="ar"?"EN":"ع";$("lang").setAttribute("aria-label",l==="ar"?"English":"العربية");
  buildRows();tick();if(cur>-1)fillProject();
}
$("lang").onclick=()=>setLang(lang==="ar"?"en":"ar");

/* Clock (Riyadh time) */
function tick(){
  const s=new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Riyadh",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  $("clock").textContent=t("city")+" "+s;
}
setInterval(tick,1000);

let active=-1;
function onScroll(){
  if(!rows.length)return;
  const mid=innerHeight*.5;let best=0,bd=1e9;
  rows.forEach((r,i)=>{const b=r.getBoundingClientRect();const d=Math.abs(b.top+b.height/2-mid);if(d<bd){bd=d;best=i}});
  if(best!==active){active=best;rows.forEach((r,i)=>r.classList.toggle("on",i===best));[...$("ghost").children].forEach((g,i)=>g.classList.toggle("on",i===best))}
}
addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});addEventListener("resize",onScroll);

/* Smooth scroll */
let lenis=null;
try{if(window.Lenis&&!matchMedia("(prefers-reduced-motion:reduce)").matches){lenis=new Lenis({lerp:.085});const raf=x=>{lenis.raf(x);requestAnimationFrame(raf)};requestAnimationFrame(raf)}}catch(e){lenis=null}

/* Views */
let cur=-1;
function closeAll(){["v-studio","v-talk","v-project"].forEach(id=>$(id).classList.remove("open"));$("pbar").classList.remove("show");document.body.classList.remove("proj");document.body.style.overflow="";if(lenis)lenis.start();cur=-1}
function openView(id){closeAll();$(id).classList.add("open");$(id).scrollTop=0;document.body.style.overflow="hidden";if(lenis)lenis.stop()}
function fillProject(){const p=P[cur];
  $("p-k").innerHTML=`<bdi>${num(cur)}</bdi>  ${t("services")[p.service]}`;$("p-title").textContent=p.title[lang];$("p-intro").textContent=p.intro[lang];
  $("p-imgs").innerHTML="";const im=new Image();im.src=p.img;im.alt=p.title[lang];$("p-imgs").appendChild(im)}
function openProject(i){
  closeAll();cur=(i+P.length)%P.length;fillProject();
  $("v-project").classList.add("open");$("v-project").scrollTop=0;$("pbar").classList.add("show");document.body.classList.add("proj");document.body.style.overflow="hidden";if(lenis)lenis.stop();
}
function route(){
  const h=location.hash.slice(1);const i=P.findIndex(p=>p.slug===h);
  if(i>-1)openProject(i);else if(h==="studio")openView("v-studio");else if(h==="talk")openView("v-talk");else closeAll();
  const v=i>-1?"":h;$("n-projects").setAttribute("aria-current",!v||v==="projects");$("n-studio").setAttribute("aria-current",v==="studio");$("n-talk").setAttribute("aria-current",v==="talk");
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();location.hash=b.dataset.go}));
$("close").onclick=()=>{location.hash="projects"};
$("prev").onclick=()=>{location.hash=P[(cur-1+P.length)%P.length].slug};
$("next").onclick=()=>{location.hash=P[(cur+1)%P.length].slug};
document.addEventListener("keydown",e=>{if(e.key==="Escape")location.hash="projects";if(cur<0)return;const rtl=lang==="ar";if(e.key==="ArrowLeft")$(rtl?"next":"prev").click();if(e.key==="ArrowRight")$(rtl?"prev":"next").click()});
let sx=null;$("v-project").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("v-project").addEventListener("touchend",e=>{if(sx==null)return;let dx=e.changedTouches[0].clientX-sx;if(lang==="ar")dx=-dx;if(Math.abs(dx)>70)(dx<0?$("next"):$("prev")).click();sx=null});
addEventListener("hashchange",route);

$("copy").onclick=()=>{const b=$("copy");const sel=()=>{const r=document.createRange();r.selectNodeContents($("email"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText($("email").textContent).then(()=>{b.textContent=t("copied");setTimeout(()=>b.textContent=t("copy"),1600)},sel)}catch(e){sel()}};

/* W cursor */
if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  document.documentElement.classList.add("has-cur");
  const c=$("cur");let x=-100,y=-100,cx=x,cy=y;
  addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;c.style.opacity=1;c.classList.toggle("big",!!e.target.closest("button,a"))});
  document.addEventListener("mouseleave",()=>c.style.opacity=0);
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  (function loop(){cx+=(x-cx)*(reduce?1:.25);cy+=(y-cy)*(reduce?1:.25);c.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(loop)})();
}

setLang(lang);route();
</script>

</body>
</html>

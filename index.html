<style>
/* Layout: one app-like card — header (mark · switches · contact), a swipeable work carousel with dots, a quiet call-to-action block, a hairline footer row. Cream and black, two modes. */
:root{
  --back:#e3e2db; --card:#faf8f3; --fg:#101014; --muted:rgba(16,16,20,.5); --line:rgba(16,16,20,.1); --ph:#ebe9e2;
  --font:"Helvetica Neue","Neue Haas Grotesk Text Pro",Helvetica,"Inter Tight",Arial,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Helvetica Neue",Arial,sans-serif;
}
body.dark{--back:#050505; --card:#111112; --fg:#edece5; --muted:rgba(237,236,229,.52); --line:rgba(237,236,229,.12); --ph:#1b1b1d; color-scheme:dark}
html,body{background:var(--back);color:var(--fg)}
body{margin:0;font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body.ar{font-family:var(--font-ar)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}

.card{width:100%;max-width:580px;min-height:100svh;margin-block:auto;background:var(--card);display:flex;flex-direction:column;transition:background .4s}
@media (min-width:640px){body{padding-block:48px}.card{min-height:0;box-shadow:0 30px 80px rgba(0,0,0,.06)}}

.head{display:flex;align-items:center;justify-content:space-between;padding:26px 30px 24px}

.head .tools{display:flex;align-items:center;gap:6px;font-size:16px}
.tools button{height:34px;min-width:34px;display:grid;place-items:center;border-radius:999px}
.lang{font-family:var(--font-ar);padding:0 6px}
body.ar .lang{font-family:var(--font)}
.mode svg{width:19px;height:19px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.dark .mode svg{transform:rotate(180deg)}
.tools .talk{padding-inline-start:10px}

/* Carousel */
.car{position:relative;aspect-ratio:570/795;max-width:100%;background:var(--ph);overflow:hidden}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;margin:0}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;align-items:center;gap:9px;pointer-events:none}
.dots button{pointer-events:auto;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);transition:width .3s,height .3s,background .3s}
.dots button.on{width:11px;height:11px;background:#fff}

/* Call to action */
.cta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:56px 70px 64px}
.cap{font-size:13px;color:var(--muted);margin:0 0 6px;min-height:1.3em;transition:opacity .3s}
.cap .ltr{margin-inline-end:6px}
.cta .main{font-size:clamp(24px,5.4vw,30px);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;width:fit-content;letter-spacing:-.015em}
.cta .alt{font-size:clamp(17px,3.6vw,20px);width:fit-content}
.cta .alt:hover{text-decoration:underline;text-underline-offset:4px}
.intro{margin:0;font-size:clamp(20px,4.6vw,24px);line-height:1.35;letter-spacing:-.015em;max-width:26ch}
@media (max-width:420px){.cta{padding:44px 30px 52px}}

/* Footer row */
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 26px;border-top:1px solid var(--line);font-size:11.5px;flex-wrap:wrap}
.foot .sep{width:1px;height:9px;background:var(--line)}
.foot .muted{color:var(--muted);flex-basis:100%}
.foot a:hover,.foot button:hover{text-decoration:underline;text-underline-offset:3px}

/* Services sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.sheet.open{opacity:1;visibility:visible}
.panel{width:100%;max-width:580px;background:var(--card);padding:30px 30px calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .4s cubic-bezier(.2,.8,.2,1),background .4s}
.sheet.open .panel{transform:none}
.panel .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;font-size:13px;color:var(--muted)}
.panel ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.panel li{padding-block:12px;border-bottom:1px solid var(--line);font-size:clamp(20px,5vw,26px);letter-spacing:-.02em}
body.ar *{letter-spacing:0!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.track{scroll-behavior:auto}}
</style>

function setLang(l){lang=l;store.set("wthb-lang",l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.body.classList.toggle("ar",l==="ar");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));$("lang").textContent=l==="ar"?"EN":"ع";$("lang").setAttribute("aria-label",l==="ar"?"English":"العربية");
  $("svc").innerHTML=t("svc").map(s=>`<li>${s}</li>`).join("");$("track").scrollLeft=0;idx=0;mark();restart()}
$("lang").onclick=()=>setLang(lang==="ar"?"en":"ar");

/* Services sheet */
const sheet=$("sheet");$("open-svc").onclick=()=>sheet.classList.add("open");$("close-svc").onclick=()=>sheet.classList.remove("open");
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")sheet.classList.remove("open")});

setLang(lang);
</script>

</body>
</html>
